# Конфигурация: Спиновый шаттл
# Spin Shuttle - Bucket-brigade transport

nanobridge:
  end_length: 450.0
  end_width: 200.0
  grip_height: 8.0
  grip_length: 200.0
  grip_width: 50.0
  mesh_size: 0.5
  oxide_thickness: 15.0

electrodes:
# Массив затворов для переноса
  - name: "G0"
    center_x: -200.0
    potential: 0.3
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G1"
    center_x: -150.0
    potential: 0.0
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G2"
    center_x: -100.0
    potential: 0.3
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G3"
    center_x: -50.0
    potential: 0.0
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G4"
    center_x: 0.0
    potential: 0.3
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G5"
    center_x: 50.0
    potential: 0.0
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G6"
    center_x: 100.0
    potential: 0.3
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G7"
    center_x: 150.0
    potential: 0.0
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

  - name: "G8"
    center_x: 200.0
    potential: 0.3
    length: 30.0
    mesh_size: 0.5
    thickness: 15.0
    coverage_angle: 180
    gap_distance: 0
    oxide_thickness: 2.0

source_drain:
  enabled: true
  thickness: 5.0
  length: 25.0
  mesh_size: 0.5
  source_potential: 0.3
  drain_potential: 0.3

substrate:
  thickness: 10.0
  padding: 60.0
  mesh_size: 2.0

air_environment:
  padding: 60.0
  height_above: 20.0
  height_below: 5.0
  mesh_size: 3.0

solver:
  grid_resolution: 100
  max_iterations: 20000
  tolerance: 1.0e-7
  relaxation_parameter: 1.7

visualization:
  slice_tolerance: 0.1
  point_size: 5
  opacity: 0.6
  color_maps:
    potential: "viridis"
    electric_field: "inferno"
    electrode: "gray"
  plot_style:
    figure_size: [20, 8]
    font_size: 14
    dpi: 150

analysis:
  potential_tolerance_percent: 1.0
  gradient_estimation_radius: 1.0
  symmetry_threshold: 0.1

materials:
  dielectric_constants:
    air: 1.0
    oxide: 3.9
    nanobridge: 11.7
    substrate: 11.7
    gate: 1.0e+10

file_path:
  output_directory: "results/shuttle"
  potential_data_file: "results/shuttle/potential.dat"
  spectra_file: "results/shuttle/spectra.dat"
  results_file: "results/shuttle/results.pkl"
  visualization_output: "results/shuttle/structure.png"
